# Builds the tutorial site and publishes it to GitHub Pages.
#
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
# While the repository is private this workflow skips itself: GitHub Pages
# needs a public repository on a free account.

name: tutorial site

on:
  push:
    branches: [main]
    paths:
      - "tutorial/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "step_*/**"          # pages include the real source files
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
