# The public tutorial site. Build with `mkdocs serve` (live preview) or
# `mkdocs build --strict` (what CI runs). Source pages live in tutorial/;
# docs/ stays the engineering notebook and is not published as-is.

site_name: PicoTalkie
site_description: >-
  Build an encrypted push-to-talk walkie-talkie on a Raspberry Pi Pico 2 W,
  one step at a time, in C with the Pico SDK.
site_author: btbbass
site_url: https://btbbass.github.io/picotalkie/

repo_url: https://github.com/btbbass/picotalkie
repo_name: btbbass/picotalkie
edit_uri: edit/main/tutorial/

docs_dir: tutorial
site_dir: site

copyright: >-
  Text &copy; 2026 btbbass &middot;
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> &middot;
  code <a href="https://github.com/btbbass/picotalkie/blob/main/LICENSE">MIT</a>

nav:
  - Home: index.md
  - "Part 1 · Blink and serial": 01-blink-and-serial.md
  - "Part 2 · A debounced button": 02-debounced-button.md
  - About and license: about.md

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/radio-handheld
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - navigation.footer
    - navigation.top
    - toc.follow

extra:
  # Shown in the attribution line under every page, and in the JSON-LD.
  author_url: https://github.com/btbbass

  # Uncomment once you have a Ko-fi page. Adds a one-line "support" note
  # under every tutorial page.
  # kofi: https://ko-fi.com/YOUR_KOFI_NAME

  # GoatCounter (free, cookieless, so no consent banner needed). The
  # dashboard is https://picotalkie.goatcounter.com
  analytics:
    provider: custom
    property: picotalkie

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/btbbass/picotalkie
      name: Source code on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Lets a page include the real source file, so the listing on the site can
  # never drift from the code in the repository:  --8<-- "step_01/main.c"
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      # Glossary: every acronym gets a hover definition on every page, so
      # the prose can define it once and experts can skip it.
      auto_append: ["includes/abbreviations.md"]
  - abbr

plugins:
  - search
